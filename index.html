<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenland Military Research Map</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <div id="timeline-container">
        <div id="timeline">
          <div id="years"></div>
          <div id="scroll-marker"></div>
        </div>
      </div>
      <div id="map"></div>

      <!-- Title screen-->
      <section id="title-screen">
        <div class="title-inner">
          <h1>geopolitics on ice</h1>
          <p class="subtitle">
            an infrastructural archive of U.S. intervention in Greenland
          </p>
        </div>
      </section>

      <!-- Map-->
      <div id="content"></div>

      <script src="script.js"></script>
    </div>
  </body>
</html>
